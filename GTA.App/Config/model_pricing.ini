; =============================================================================
; model_pricing.ini — editable LLM pricing table (USD)
; =============================================================================
;
; Add / edit / remove a [ModelName] section for every model you want the chat
; UI to show a cost estimate for. The section name MUST exactly match the
; model string the app actually sends to the API — see:
;   GTA.Core.AppConfig.MODEL         (Claude,  currently "claude-sonnet-5-5")
;   GTA.Core.AppConfig.GPT_MODEL     (GPT,     currently "gpt-6.1-sol")
;   GTA.Core.AppConfig.GEMINI_MODEL  (Gemini,  currently "gemini-3.7-flash")
; or just check the "[Backend] ..." line in the chat log — it prints the
; active provider (model name is whatever ILlmClient.ModelName returns).
;
; A model with NO matching section here simply shows "N/A" for cost in the
; UI and in saved session logs — nothing breaks, it just isn't priced yet.
;
; All four values are USD per ONE MILLION tokens (MTok):
;   Input      — normal (non-cached) prompt/input tokens
;   Output     — tokens the model generates
;   CacheWrite — tokens written INTO the prompt cache during this call
;   CacheRead  — tokens served FROM the prompt cache (cache hits)
;
; This file is re-read automatically whenever its last-modified time changes,
; so edits take effect on your NEXT message — no app restart required.
;
; Comments start with ';' or '#' (full-line or trailing after a value).
; =============================================================================

[claude-sonnet-5-5]
Input      = 2.00
Output     = 10.00
CacheWrite = 2.50 ; 5-minute cache TTL (1-hour TTL is $4.00/MTok — not representable here, this file only models one CacheWrite tier)
CacheRead  = 0.10

[gpt-6.1-sol]
Input      = 2.00
Output     = 10.00
CacheWrite = 2.50 ; 30-minute cache TTL
CacheRead  = 0.10

[gemini-3.7-flash]
Input      = 0.75
Output     = 3.75
CacheWrite = 0.50
CacheRead  = 0.075